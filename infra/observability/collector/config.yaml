# OpenTelemetry Collector of the local services topology (ADR 0018, STAGE_4_PLAN 6.3). Every app exports OTLP here;
# the collector forwards metrics to Prometheus, logs to Loki, traces to Tempo, and everything to the Aspire dashboard.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # The Aspire dashboard keeps showing everything; the collector integration passes its endpoint and API key.
  otlp/aspire:
    endpoint: ${env:ASPIRE_ENDPOINT}
    headers:
      x-otlp-api-key: ${env:ASPIRE_API_KEY}
    tls:
      insecure_skip_verify: true

# No health_check extension here: the Aspire integration adds its own (health_check/aspire).
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus, otlp/aspire]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, otlp/aspire]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, otlp/aspire]
