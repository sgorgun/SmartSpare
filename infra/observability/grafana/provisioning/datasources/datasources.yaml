# Data sources of the local Grafana (STAGE_4_PLAN 6.4); local only, Grafana Cloud has its own.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  # Grafana Cloud keeps its usage metrics (grafanacloud_instance_active_series) in a separate data source; locally the
  # uid "usage" is the same Prometheus, so the free-tier panel and the active-series rule work in both.
  - name: Usage
    uid: usage
    type: prometheus
    access: proxy
    url: http://prometheus:9090
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
