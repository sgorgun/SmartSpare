# Local development database (same major version as Azure Flexible Server).
services:
  postgres:
    image: postgres:17
    container_name: smartspare-postgres
    environment:
      # Local superuser, development only. From .env (gitignored), see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
