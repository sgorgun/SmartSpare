name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

# Every step runs through tools/check.sh, the script developers run locally (CONTRIBUTING.md),
# so the local check set and CI cannot drift apart.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Stale terms, restore, vulnerable packages, build, format, check-model, tests and the coverage gate: the same
      # composite action every deploy workflow runs before it builds an image (STAGE_4_PLAN 8.3).
      - uses: ./.github/actions/gates

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: tools/check.sh restore

      - name: Build
        run: tools/check.sh build

      # Testcontainers starts postgres:17 through the runner's Docker daemon.
      - name: Integration tests
        run: tools/check.sh integration

      # MODULE_MAPPING section 6, steps 2-4: build the database with the MigrationRunner on
      # postgres:17, load T001 (2,000 SKUs), run the 102 SQL assertions and the concurrency test,
      # then require mart.v_data_quality = 0 and no util.v_privilege_findings.
      - name: Verify the EF-built database with the SQL suite
        run: tools/check.sh database

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: ignore

  # Both coverage figures in one job summary: the unit-test gate again, and unit + integration as a report (no gate).
  # Not a required check; it only reads the two jobs' Cobertura files.
  coverage:
    name: Coverage report
    needs: [build, integration]
    if: always() && needs.build.result != 'cancelled' && needs.integration.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: test-results
          path: TestResults

      - uses: actions/download-artifact@v8
        with:
          name: integration-test-results
          path: TestResults

      - name: Unit and unit + integration coverage
        run: tools/check.sh coverage coverage-combined

      - name: Upload the combined coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-combined
          path: TestResults/coverage-combined
          if-no-files-found: ignore

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: tools/check.sh restore

      - name: Build
        run: tools/check.sh build

      # STAGE_3_PLAN 9.4: the real host on Kestrel, postgres:17 with the migrations, T001 and demo passwords
      # (Testcontainers), and headless Chromium driven by Playwright: redirect to sign-in, the generic failure with
      # its trace id, sign-in as a brand manager with the menu, sign-out.
      - name: End-to-end smoke test (Playwright, Chromium)
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps
        run: tools/check.sh e2e

      - name: Upload screenshots and the Playwright trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            TestResults/e2e
            TestResults/*.trx
          if-no-files-found: ignore

  topology:
    name: Topology test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: tools/check.sh restore

      - name: Build
        run: tools/check.sh build

      # STAGE_4_PLAN section 10 (#57): the gateway and the Identity and Inventory service hosts in one process,
      # postgres:17 and rabbitmq:4.4 through Testcontainers. Sign-in through the gateway, both services reached with
      # minted tokens, the diagnostics probe from Identity to Inventory over RabbitMQ with its linked trace, and
      # /internal and service health never routed.
      - name: Topology test
        run: tools/check.sh topology

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: topology-test-results
          path: TestResults
          if-no-files-found: ignore

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # STAGE_4_PLAN 8.1 and 4h: every deployable image builds (SDK container publishing, chiseled "extra" base), into the
      # runner's Docker only. The deploy workflows push the same images to ACR from stage 10 on (#85).
      - name: Build the images
        run: tools/build-images.sh

      # The migration job's image starts and lists the catalogue (ADR 0020); the gateway image answers its liveness probe.
      - name: Smoke-test two images
        run: |
          docker run --rm smartspare/migrations:dev list
          docker run -d --name gateway-smoke -p 8080:8080 smartspare/gateway:dev
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/health/live && exit 0; sleep 1; done
          docker logs gateway-smoke
          exit 1
