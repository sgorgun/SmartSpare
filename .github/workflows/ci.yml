name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Fails if a lock file is out of date with the project; run `dotnet restore` locally and commit it.
      - name: Restore
        run: dotnet restore SmartSpare.slnx --locked-mode

      - name: Build
        run: dotnet build SmartSpare.slnx --no-restore --configuration Release -warnaserror

      - name: Check formatting
        run: dotnet format SmartSpare.slnx --no-restore --verify-no-changes

      # Tests that need Docker (Testcontainers) are tagged Category=Integration and run separately.
      - name: Test
        run: >
          dotnet test SmartSpare.slnx --no-build --configuration Release
          --filter "Category!=Integration"
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
