name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Fails if a tracked file describes a retired part of the architecture as current. The terms
      # are listed in tools/check_stale_terms.py; ADRs, EF migration history, marked history notes
      # and the paths in tools/stale_terms.allow are exempt.
      - name: Check for stale architecture terms
        run: python3 tools/check_stale_terms.py

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Fails if a lock file is out of date with the project; run `dotnet restore` locally and commit it.
      - name: Restore
        run: dotnet restore SmartSpare.slnx --locked-mode

      - name: Build
        run: dotnet build SmartSpare.slnx --no-restore --configuration Release -warnaserror

      - name: Check formatting
        run: dotnet format SmartSpare.slnx --no-restore --verify-no-changes

      # Fails if any DbContext's model differs from its last migration snapshot (a migration is
      # missing). Same check as `dotnet ef migrations has-pending-model-changes`, run for every
      # context of the module catalogue, so new contexts are covered automatically.
      - name: Check for pending model changes
        run: dotnet run --project src/Bootstrapper/SmartSpare.MigrationRunner --no-build --configuration Release -- check-model

      # Tests that need Docker (Testcontainers) are tagged Category=Integration and run separately.
      - name: Test
        run: >
          dotnet test SmartSpare.slnx --no-build --configuration Release
          --filter "Category!=Integration"
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore SmartSpare.slnx --locked-mode

      - name: Build
        run: dotnet build SmartSpare.slnx --no-restore --configuration Release -warnaserror

      # Testcontainers starts postgres:17 through the runner's Docker daemon.
      - name: Integration tests
        run: >
          dotnet test SmartSpare.slnx --no-build --configuration Release
          --filter "Category=Integration"
          --logger trx --results-directory TestResults

      # MODULE_MAPPING section 6, steps 2-4: build the database with the MigrationRunner on
      # postgres:17, load T001 (2,000 SKUs), run the 97 SQL assertions and the concurrency test,
      # then require mart.v_data_quality = 0 and no util.v_privilege_findings.
      - name: Verify the EF-built database with the SQL suite
        env:
          RUNNER_ARGS: --no-build --configuration Release
        run: tools/verify_database.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: TestResults
          if-no-files-found: ignore
