name: Infrastructure

# STAGE_4_PLAN 8.8: the Bicep templates in infra/. Every pull request that changes them builds and lints them. Once
# Azure sign-in is configured (repository variable AZURE_CLIENT_ID, federated credential), it also runs what-if against
# the subscription, which creates nothing. Only a manual run with mode "deploy" applies them (stage 10, #85).
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/*.bicep'
      - 'infra/*.bicepparam'
      - 'infra/modules/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: what-if (nothing changes) or deploy
        type: choice
        options: [what-if, deploy]
        default: what-if

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  validate:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.prod.bicepparam --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  azure:
    name: ${{ inputs.mode == 'deploy' && 'Deploy' || 'What-if' }}
    needs: validate
    if: github.event_name == 'workflow_dispatch' || vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.sha }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        if: inputs.mode != 'deploy'
        run: >-
          az deployment sub what-if --name "smartspare-${{ github.run_id }}" --location westeurope
          --template-file infra/main.bicep --parameters infra/main.prod.bicepparam

      - name: Deploy
        if: inputs.mode == 'deploy'
        run: >-
          az deployment sub create --name "smartspare-${{ github.run_id }}" --location westeurope
          --template-file infra/main.bicep --parameters infra/main.prod.bicepparam
